name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de OWASP Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/latest/download/dependency-check-11.1.1-release.zip
          unzip dependency-check-11.1.1-release.zip

      - name: Contrôle des dépendances (OWASP Dependency-Check)
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "MonApplication" \
            --scan . \
            --out ./rapports \
            --format HTML \
            --failOnCVSS 7

      - name: Upload du rapport de vulnérabilités
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-dependences
          path: ./rapports

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyse statique avec Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Scan des secrets dans le code (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image Docker
        run: docker build -t monapp:${{ github.sha }} .

      - name: Scan de l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: monapp:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
